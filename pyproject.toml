[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ViennaFit"
dynamic = ["version"]
description = "A Python package for fitting ViennaPS simulation models to experimental data."
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    { name = "Roman Kostal" },
]
maintainers = [
    { name = "Institute for Microelectronics, TU Wien", email = "viennatools@iue.tuwien.ac.at" },
]
keywords = [
    "process-simulation",
    "parameter-optimization",
    "model-calibration",
    "sensitivity-analysis",
    "semiconductor",
    "topography-simulation",
    "level-set",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    # ViennaPS owns the ViennaLS version (ViennaFit reaches ViennaLS via
    # viennaps.ls), so ViennaLS is normally not declared here.
    # Upper bound is the last validated major; Dependabot + the compat workflow
    # gate raising it. See scripts/check_upstream.py and tests/test_upstream_compat.py.
    "viennaps>=4.4,<5",
    # Temporary: ViennaLS 5.9.0 is built with pybind11 3.1 (type registry v12),
    # viennaps <= 4.6.2 with the older registry (v11), so the two cannot share
    # types and `import viennaps` fails. viennaps does not cap ViennaLS itself.
    # Drop once ViennaPS ships wheels built against pybind11 3.1.
    "viennals<5.9",
    "dlib-bin>=19.24.6",
    "cma>=3.2.2",
    "numpy>=1.26",
    "nevergrad>=1.0.12",
    "SALib>=1.5.1",
    "matplotlib>=3.5",
    "pandas>=1.5",
    "Pillow>=9.0",
]

[project.optional-dependencies]
bayesian = [
    "botorch>=0.15.1",
    "gpytorch>=1.14",
    "ax-platform>=1.1.2",
]

[project.scripts]
viennafit-view-best = "viennafit.fitParaviewViewer:_viewBestCLI"
viennafit-view-custom-eval = "viennafit.fitParaviewViewer:_viewCustomEvaluationCLI"
viennafit-annotate = "viennafit.fitAnnotator:_annotateCLI"
viennafit-finalize = "viennafit.fitProject:_finalizeRunCLI"

[project.urls]
Documentation = "https://viennatools.github.io/ViennaFit/"
Repository = "https://github.com/ViennaTools/ViennaFit"
Issues = "https://github.com/ViennaTools/ViennaFit/issues"

[tool.setuptools.dynamic]
version = { attr = "viennafit.__version__" }

[tool.setuptools.package-data]
viennafit = ["py.typed"]

[tool.black]
line-length = 88
target-version = ['py310']
include = '\.pyi?$'
