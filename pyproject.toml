[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
version = "2.0.0"
name = "ViennaFit"
readme = "README.md"
description = "A Python package for fitting ViennaPS simulation models to experimental data."
dependencies = [
    "viennaps>=4.0.0",
    "dlib-bin==19.24.6",
    "cma==3.2.2",
    "numpy==1.26.4",
    "nevergrad>=1.0.12",
    "SALib >= 1.5.1",
    "matplotlib>=3.5",
    "pandas>=1.5",
    "Pillow>=9.0",
    ]

[project.scripts]
viennafit-view-best = "viennafit.fitParaviewViewer:_viewBestCLI"
viennafit-view-custom-eval = "viennafit.fitParaviewViewer:_viewCustomEvaluationCLI"
viennafit-annotate = "viennafit.fitAnnotator:_annotateCLI"

[project.urls]
Repository = "https://github.com/ViennaTools/ViennaFit.git"

[tool.black]
line-length = 88
target-version = ['py310']
include = '\.pyi?$'
