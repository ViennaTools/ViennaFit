name: Upstream compatibility

# Catches ViennaPS/ViennaLS API breakage against ViennaFit's actual usage.
# Installs whatever the pyproject bounds resolve to, so it covers the supported
# range only. Runs weekly (so new upstream releases inside that range surface as
# a red badge, not a user bug report) and on PRs that touch dependencies (e.g.
# Dependabot bumps).

on:
  schedule:
    # Mondays 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - "pyproject.toml"
      - "tests/test_upstream_compat.py"
      - ".github/workflows/compat.yml"

jobs:
  compat:
    name: Compat (pinned ViennaPS/ViennaLS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install ViennaFit (pinned dependencies)
        run: pip install .
      - name: Report resolved versions
        run: |
          python -c "import viennaps, viennals; print('ViennaPS', viennaps.__version__); print('ViennaLS', viennals.__version__)"
      - name: Run compatibility checks
        run: python tests/test_upstream_compat.py
