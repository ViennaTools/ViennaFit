name: Build

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  install:
    name: Install (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: pip install .
      - name: Import package
        run: |
          python -c "import viennafit; print('ViennaFit', viennafit.__version__)"
      - name: Check console scripts
        run: |
          viennafit-view-best --help
          viennafit-annotate --help
