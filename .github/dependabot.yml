version: 2
updates:
  # Open PRs when ViennaPS (or other Python deps) publish new versions.
  # The compat workflow runs on these PRs, so a green check means the bump is
  # safe against ViennaFit's actual API usage. (ViennaLS is not declared here:
  # ViennaPS owns its version, so it moves with viennaps bumps.)
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      viennatools:
        patterns:
          - "viennaps"

  # Keep the GitHub Actions current; bundle all action bumps into one PR.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    groups:
      github-actions:
        patterns:
          - "*"
